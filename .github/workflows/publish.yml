name: Publish builder image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: "094954420758"

jobs:
  publish:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve image version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          if [ -z "${VERSION}" ]; then
            VERSION="sha-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and publish version tag
        uses: DEFRA/cdp-build-action/build-dockerhub@main
        with:
          image-name: cdp-api-docs-builder
          version: ${{ steps.version.outputs.version }}

      - name: Build and publish latest tag
        uses: DEFRA/cdp-build-action/build-dockerhub@main
        with:
          image-name: cdp-api-docs-builder
          version: latest
