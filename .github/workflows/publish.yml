name: Publish builder image

# Pushes defradigital/cdp-api-docs-builder:<version> and :latest to Docker Hub, where
# tenant workflows pull it from. A platform image, so it uses github-ecr-role, not a tenant build role
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  IMAGE_NAME: cdp-api-docs-builder

jobs:
  publish:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docker Login
        uses: DEFRA/cdp-build-action/docker-login@main
        with:
          iam-role-name: github-ecr-role

      - name: Work out the next version
        id: version
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: false
          DRY_RUN: true

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          no-cache: true
          push: true
          tags: |
            defradigital/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.new_tag }}
            defradigital/${{ env.IMAGE_NAME }}:latest
          labels: |
            defra.cdp.git.repo.url=${{ github.server_url }}/${{ github.repository }}
            defra.cdp.git.repo.name=${{ github.repository }}
            defra.cdp.build.run_id=${{ github.run_id }}
            git.hash=${{ github.sha }}

      # Tag the commit only once the image exists, so a version tag always has an image
      - name: Tag the release
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: false
